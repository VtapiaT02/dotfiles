# Usa xterm-256color como terminal por defecto
#set -g default-terminal "screen-256color"

# Habilita true color (24-bit)
#set-option -ga terminal-overrides ",xterm-256color:Tc"

# Enable truecolor (24-bit) support
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB"

# Cambiar prefix por defecto
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Cambiar split vertical y horizontal
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# Recargar .tmux con "r"
unbind r
bind r source-file ~/.tmux.conf

# Cambiar dimensionamiento de paneles
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Cambiar maximizar panel
bind -r m resize-pane -Z

# Permitir usar Ecs con Neovim
set -s escape-time 10

# Habilitar teclas de vim en el modo copia
set -g mode-keys vi

# Habilitar el uso de mouse
set -g mouse on

# Index base 1
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Cargar TMP plugin
set -g @plugin 'tmux-plugins/tpm'

# Lista de plugins para tmux
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'

############## Inicia Tema ############## 
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

